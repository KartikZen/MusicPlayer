<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karya Music</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <style>

    </style>
</head>

<body>
    <div class="container">
        <div class="music_player">
            <nav>
                <div class="circle" id="back-btn" title="Back">
                    <i class="bi bi-chevron-left"></i>
                </div>
                <div class="circle" id="playlist-btn" title="Playlist">
                    <i class="bi bi-music-note-list"></i>
                </div>
                <div class="circle" id="menu-btn" title="Menu">
                    <i class="bi bi-text-indent-left"></i>
                </div>
            </nav>
            <img src="https://images.unsplash.com/photo-1571330735066-03aaa9429d89?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=60" class="song-img" alt="song image" id="song-img">
            <div class="song-info-main">
                <h2 class="song-name" id="song-name"><span class="marquee">Kesariya</span></h2>
            </div>
            <p class="song-artist" id="song-artist">Arijit Singh</p>

            <audio id="audio">
                <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
            </audio>
            
            <!-- Song Progress Bar with Time -->
            <div class="time-container">
                <span id="current-time">0:00</span>
                <input type="range" value="0" id="progress-bar">
                <span id="duration">0:00</span>
            </div>
            
            <!-- Volume Bar -->
            <div class="volume-container">
                <i class="bi bi-volume-up" id="volume-icon"></i>
                <input type="range" id="volume-bar" min="0" max="1" step="0.01" value="1">
            </div>

            <div class="controls">
                <div id="shuffle-btn" title="Shuffle"><i class="bi bi-shuffle"></i></div>
                <div id="prev-btn"><i class="bi bi-skip-start-fill"></i></div>
                <div id="play-btn"><i class="bi bi-play-fill"></i></div>
                <div id="next-btn"><i class="bi bi-skip-end-fill"></i></div>
                <div id="repeat-btn" title="Repeat"><i class="bi bi-repeat"></i></div>
            </div>

            <!-- Additional Features Panel -->
            <div class="features-panel">
                <button class="feature-btn" id="favorites-btn">
                    <i class="bi bi-heart"></i> Favorites
                </button>
                <button class="feature-btn" id="custom-playlist-btn">
                    <i class="bi bi-plus-circle"></i> Playlists
                </button>
                <button class="feature-btn" id="lyrics-btn">
                    <i class="bi bi-mic"></i> Lyrics
                </button>
                <button class="feature-btn" id="timer-btn">
                    <i class="bi bi-alarm"></i> Timer
                </button>
            </div>
        </div>
    </div>

    <!-- Playlist Modal - IMPROVED -->
    <div class="playlist-modal" id="playlist-modal">
        <div class="playlist-content">
            <div class="playlist-header">
                <h3>Playlist</h3>
                <span class="close-playlist" id="close-playlist">&times;</span>
            </div>
            
            <div class="playlist-controls">
                <select id="singer-select">
                    <option value="arijit">Arijit Singh</option>
                    <option value="jubin">Jubin Nautiyal</option>
                    <option value="vishal">Vishal Mishra</option>
                    <option value="honey">Honey Singh</option>
                    <option value="custom">My Playlists</option>
                </select>
                
                <div class="playlist-search">
                    <input type="text" id="playlist-search-input" placeholder="Search songs...">
                    <i class="bi bi-search"></i>
                </div>
            </div>
            
            <div class="playlist-list-container">
                <ul class="playlist-list" id="playlist-list">
                    <!-- Songs will be injected here -->
                </ul>
            </div>
            
            <div class="playlist-stats" id="playlist-stats">
                <!-- Playlist stats will be injected here -->
            </div>
        </div>
    </div>

    <!-- Custom Playlist Modal -->
    <div class="custom-playlist-modal" id="custom-playlist-modal">
        <div class="custom-playlist-content">
            <div class="custom-playlist-header">
                <h3>My Playlists</h3>
                <span class="close-custom-playlist" id="close-custom-playlist">&times;</span>
            </div>
            
            <div class="custom-playlist-controls">
                <input type="text" id="new-playlist-name" placeholder="New playlist name">
                <button id="create-playlist-btn">Create</button>
            </div>
            
            <div class="custom-playlist-list-container">
                <ul class="custom-playlist-list" id="custom-playlist-list">
                    <!-- Custom playlists will be injected here -->
                </ul>
            </div>
        </div>
    </div>

    <!-- Lyrics Modal -->
    <div class="lyrics-modal" id="lyrics-modal">
        <div class="lyrics-content">
            <div class="lyrics-header">
                <h3>Lyrics</h3>
                <span class="close-lyrics" id="close-lyrics">&times;</span>
            </div>
            
            <div class="lyrics-container" id="lyrics-container">
                <!-- Lyrics will be injected here -->
            </div>
        </div>
    </div>

    <!-- Sleep Timer Modal -->
    <div class="timer-modal" id="timer-modal">
        <div class="timer-content">
            <h3>Sleep Timer</h3>
            <div class="timer-options">
                <div class="timer-option" data-minutes="5">5 min</div>
                <div class="timer-option" data-minutes="15">15 min</div>
                <div class="timer-option" data-minutes="30">30 min</div>
                <div class="timer-option" data-minutes="60">60 min</div>
                <div class="timer-option" data-minutes="0">Custom</div>
            </div>
            <div class="timer-display" id="timer-display">Timer Off</div>
            <div id="custom-timer" style="display: none; margin: 15px 0;">
                <input type="number" id="custom-minutes" min="1" max="180" placeholder="Minutes" style="padding: 10px; width: 120px; border-radius: 8px; border: 1px solid #ddd; text-align: center;">
                <button id="set-custom-timer" style="padding: 10px 15px; background: #f53192; color: white; border: none; border-radius: 8px; margin-left: 10px; cursor: pointer;">Set</button>
            </div>
            <div style="margin-top: 20px;">
                <button id="cancel-timer" style="padding: 12px 25px; background: #f0f0f0; border: none; border-radius: 25px; cursor: pointer; margin-right: 10px; font-weight: bold;">Cancel</button>
                <button id="start-timer" style="padding: 12px 25px; background: #f53192; color: white; border: none; border-radius: 25px; cursor: pointer; font-weight: bold;">Start Timer</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
